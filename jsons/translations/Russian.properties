########## Nations ##########
Shaheds = Шахеды
Saddam Hussein = Саддам Хусейн
Shahed = шахедский
The Swarm = Рой

Saddam Hussein, leader of the Shaheds! Born in 1937 in the village of Al-Awja near Tikrit, you rose through the Ba'ath Party and ruled Iraq from 1979 to 2003. Your rule was marked by long wars with Iran and Kuwait and by harsh repression at home, and it ended with the invasion of 2003. = Саддам Хусейн, вождь Шахедов! Вы родились в 1937 году в деревне Эль-Ауджа под Тикритом, поднялись через партию Баас и правили Ираком с 1979 по 2003 год. Ваше правление запомнилось долгими войнами с Ираном и Кувейтом и жёсткими репрессиями внутри страны и закончилось вторжением 2003 года.
Now a new nation gathers under your banner. Its weapon is the swarm: countless cheap drones that fly where armies cannot pass. Will the swarm darken the skies of the whole world? = Теперь под вашим знаменем собирается новый народ. Его оружие — рой: бесчисленные дешёвые дроны, которые летят туда, где не пройдёт ни одна армия. Затмит ли рой небо над всем миром?

The sky above your cities no longer belongs to you. = Небо над вашими городами вам больше не принадлежит.
You have stirred the swarm. Now listen to it buzz. = Вы растревожили рой. Теперь слушайте, как он жужжит.
The swarm scatters... but it always returns. = Рой рассеян... но он всегда возвращается.
I am Saddam Hussein. My drones have been watching you for quite some time. = Я — Саддам Хусейн. Мои дроны давно за вами наблюдают.
Speak. The swarm is listening. = Говори. Рой слушает.
What now? My drones are already fueled. = Что ещё? Мои дроны уже заправлены.
A fair deal. Even drones need fuel. = Честная сделка. Даже дронам нужно топливо.
Peace, then. The drones will wait in their hangars. = Что ж, мир. Дроны подождут в ангарах.

Each military unit lost in battle gives 20 Gold = Каждый боевой юнит, погибший в бою, приносит 20 золота
Whoever kills a Shahed unit in close combat dies in the explosion. Ranged attacks are safe = Кто убьёт юнита Шахедов в ближнем бою — сам погибнет от взрыва. Выстрел издалека безопасен

